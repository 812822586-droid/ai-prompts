<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="AI 提示词大全 —— 662+ 精选中文提示词，覆盖写作、职场、编程、运营、求职、副业、教学等场景。一键复制，支持收藏。" />
  <meta name="theme-color" content="#4f46e5" />
  <title>AI 提示词大全 · Prompt Library</title>
  <style>
    :root {
      --bg: #f4f5f9;
      --bg-elevated: #ffffff;
      --text: #1a1d26;
      --text-muted: #5c6478;
      --border: #e4e7ef;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --accent: #06b6d4;
      --success: #059669;
      --danger: #dc2626;
      --chip: #eef0f6;
      --chip-active: #4f46e5;
      --chip-active-text: #fff;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
      --radius: 14px;
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --bg-elevated: #1a1d27;
      --text: #e8eaf0;
      --text-muted: #9aa3b5;
      --border: #2a2f3d;
      --primary: #818cf8;
      --primary-hover: #a5b4fc;
      --primary-soft: #1e1b4b;
      --accent: #22d3ee;
      --success: #34d399;
      --chip: #252a38;
      --chip-active: #818cf8;
      --chip-active-text: #0f1117;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
    }
    a { color: var(--primary); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 80px; }

    /* Header */
    header.app-header {
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
    }
    .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; }
    .brand p { margin: 0; font-size: .72rem; color: var(--text-muted); }
    .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--bg-elevated);
      color: var(--text); border-radius: 10px; padding: 8px 10px;
      cursor: pointer; font-size: .85rem; display: inline-flex; align-items: center; gap: 6px;
      transition: background .15s, border-color .15s;
    }
    .icon-btn:hover { border-color: var(--primary); }
    .icon-btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

    /* Hero */
    .hero {
      padding: 28px 0 8px;
      text-align: center;
    }
    .hero h2 { margin: 0 0 8px; font-size: clamp(1.4rem, 3vw, 1.9rem); }
    .hero p { margin: 0 auto 18px; max-width: 560px; color: var(--text-muted); font-size: .95rem; }
    .stats {
      display: inline-flex; gap: 18px; flex-wrap: wrap; justify-content: center;
      padding: 10px 18px; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 999px; box-shadow: var(--shadow); font-size: .85rem; color: var(--text-muted);
    }
    .stats strong { color: var(--text); }

    /* Search & filters */
    .controls { margin: 22px 0 12px; }
    .search-box {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow);
    }
    .search-box input {
      flex: 1; border: 0; outline: 0; background: transparent;
      font-size: 1rem; color: var(--text); font-family: inherit;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .chips {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
    }
    .chip {
      border: 1px solid var(--border); background: var(--chip);
      color: var(--text); border-radius: 999px; padding: 6px 12px;
      font-size: .82rem; cursor: pointer; transition: .15s;
      font-family: inherit;
    }
    .chip:hover { border-color: var(--primary); }
    .chip.active {
      background: var(--chip-active); color: var(--chip-active-text);
      border-color: transparent;
    }
    .result-meta {
      margin: 14px 0 8px; font-size: .85rem; color: var(--text-muted);
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
    }

    /* Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 16px 14px;
      box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
      transition: transform .15s, border-color .15s;
    }
    .card:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); transform: translateY(-1px); }
    .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .card-title { margin: 0; font-size: 1.02rem; font-weight: 650; line-height: 1.35; }
    .fav-btn {
      border: 0; background: transparent; cursor: pointer; font-size: 1.2rem;
      line-height: 1; color: var(--text-muted); padding: 2px 4px; border-radius: 6px;
    }
    .fav-btn.on { color: #f59e0b; }
    .fav-btn:hover { background: var(--chip); }
    .cat-badge {
      display: inline-block; font-size: .72rem; padding: 2px 8px;
      border-radius: 6px; background: var(--primary-soft); color: var(--primary); font-weight: 600;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: .7rem; color: var(--text-muted); background: var(--chip);
      padding: 2px 7px; border-radius: 5px;
    }
    .prompt-preview {
      font-size: .86rem; color: var(--text-muted);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; white-space: pre-wrap; word-break: break-word;
      flex: 1;
    }
    .tip-line { font-size: .78rem; color: var(--accent); }
    .card-actions { display: flex; gap: 8px; margin-top: 2px; }
    .btn {
      border: 0; border-radius: 10px; padding: 8px 12px; font-size: .85rem;
      cursor: pointer; font-family: inherit; font-weight: 600;
      transition: background .15s, opacity .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: var(--chip); color: var(--text); }
    .btn-ghost:hover { opacity: .85; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .empty {
      text-align: center; padding: 48px 16px; color: var(--text-muted);
      background: var(--bg-elevated); border: 1px dashed var(--border); border-radius: var(--radius);
    }

    footer {
      margin-top: 40px; padding: 24px 0; text-align: center;
      font-size: .8rem; color: var(--text-muted); border-top: 1px solid var(--border);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(10,12,20,.55);
      z-index: 100; display: none; align-items: flex-end; justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; }
    }
    .modal {
      background: var(--bg-elevated); color: var(--text);
      border-radius: 16px; width: min(560px, 100%);
      max-height: min(88vh, 720px); overflow: auto;
      border: 1px solid var(--border); box-shadow: var(--shadow);
      padding: 18px 18px 16px;
    }
    .modal header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .modal h3 { margin: 0; font-size: 1.1rem; }
    .close-btn { border: 0; background: var(--chip); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 1.1rem; color: var(--text); }
    .full-prompt {
      white-space: pre-wrap; word-break: break-word;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; font-size: .9rem; line-height: 1.6;
    }
    .ph-form { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .ph-form label { font-size: .8rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .ph-form input, .ph-form textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 11px; font-family: inherit; font-size: .9rem;
      background: var(--bg); color: var(--text);
    }
    .ph-form textarea { min-height: 70px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: #111827; color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: .9rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    [data-theme="dark"] .toast { background: #e8eaf0; color: #111; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .brand p { display: none; }
      .card-actions .btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="logo" aria-hidden="true">AI</div>
        <div>
          <h1>AI 提示词大全</h1>
          <p>实用中文 Prompt 库 · 一键复制</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="favOnlyBtn" title="只看收藏" aria-pressed="false">★ 只看收藏</button>
        <button type="button" class="icon-btn" id="themeBtn" title="切换深浅色">☾ 深色</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h2>找对提示词，AI 更好用</h2>
      <p>面向写作、职场、短视频运营、求职、编程等中国用户真实场景。全部可本地收藏，无需登录。</p>
      <div class="stats">
        <span>共 <strong id="totalCount">0</strong> 条</span>
        <span>分类 <strong id="catCount">0</strong> 个</span>
        <span>收藏 <strong id="favCount">0</strong> 条</span>
      </div>
    </section>

    <section class="controls">
      <div class="search-box">
        <span aria-hidden="true">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索标题、标签或提示词内容…" autocomplete="off" />
      </div>
      <div class="chips" id="chipBar" role="tablist" aria-label="分类筛选"></div>
      <div class="result-meta">
        <span id="shownMeta">显示 0 条</span>
        <span style="font-size:.78rem">点击卡片可填写【占位符】后再复制</span>
      </div>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>
    <div style="text-align:center;margin:18px 0 8px">
      <button type="button" class="btn btn-ghost" id="loadMore" hidden>加载更多</button>
    </div>
    <div class="empty" id="empty" hidden>没有找到匹配的提示词，试试别的关键词或分类。</div>
  </main>

  <footer class="wrap">
    <p>MIT License · 由 <strong>812822586-droid</strong> 维护 · 欢迎 Star 与贡献新提示词</p>
    <p style="margin-top:6px">灵感参考 <a href="https://prompts.chat" target="_blank" rel="noopener">prompts.chat</a>（awesome-chatgpt-prompts, CC0）· 本站内容为原创中文场景</p>
  </footer>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <header>
        <div>
          <div class="cat-badge" id="modalCat"></div>
          <h3 id="modalTitle" style="margin-top:8px"></h3>
        </div>
        <button type="button" class="close-btn" id="modalClose" aria-label="关闭">×</button>
      </header>
      <div class="full-prompt" id="modalPrompt"></div>
      <p class="tip-line" id="modalTip" style="margin:10px 0 0"></p>
      <div class="ph-form" id="phForm" hidden></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="modalCopy">复制提示词</button>
        <button type="button" class="btn btn-ghost" id="modalFav">收藏</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">已复制</div>

  <script src="prompts-data.js"></script>
  <script>
(function () {
  const STORAGE_FAV = "ai-prompts-favs-v1";
  const STORAGE_THEME = "ai-prompts-theme-v1";

  const data = Array.isArray(window.PROMPT_DATA) ? window.PROMPT_DATA : [];
  const categories = [...new Set(data.map(d => d.category))];

  let favs = new Set(JSON.parse(localStorage.getItem(STORAGE_FAV) || "[]"));
  let activeCat = "全部";
  let favOnly = false;
  let query = "";
  let current = null;
  const PAGE_SIZE = 24;
  let visibleCount = PAGE_SIZE;

  const $ = (id) => document.getElementById(id);
  const grid = $("grid");
  const empty = $("empty");
  const chipBar = $("chipBar");
  const searchInput = $("searchInput");
  const toastEl = $("toast");
  const modal = $("modal");

  function saveFavs() {
    localStorage.setItem(STORAGE_FAV, JSON.stringify([...favs]));
    $("favCount").textContent = String(favs.size);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("已复制");
      return true;
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        toast("已复制");
        return true;
      } catch (err) {
        toast("复制失败，请手动选择");
        return false;
      } finally {
        document.body.removeChild(ta);
      }
    }
  }

  function extractPlaceholders(text) {
    const re = /【[^】]+】/g;
    const found = text.match(re) || [];
    const uniq = [];
    found.forEach(p => { if (!uniq.includes(p)) uniq.push(p); });
    return uniq;
  }

  function applyPlaceholders(text, values) {
    let out = text;
    Object.keys(values).forEach(k => {
      const v = values[k];
      if (v != null && String(v).trim() !== "") {
        out = out.split(k).join(String(v).trim());
      }
    });
    return out;
  }

  function filtered() {
    const q = query.trim().toLowerCase();
    return data.filter(p => {
      if (favOnly && !favs.has(p.id)) return false;
      if (activeCat !== "全部" && p.category !== activeCat) return false;
      if (!q) return true;
      const hay = (p.title + " " + p.category + " " + (p.tags || []).join(" ") + " " + p.prompt + " " + (p.tip || "")).toLowerCase();
      return hay.includes(q);
    });
  }

  function renderChips() {
    const all = ["全部", ...categories];
    chipBar.innerHTML = all.map(c => {
      const count = c === "全部" ? data.length : data.filter(d => d.category === c).length;
      const active = c === activeCat ? "active" : "";
      return `<button type="button" class="chip ${active}" data-cat="${c.replace(/"/g, "&quot;")}">${c} <span style="opacity:.7">${count}</span></button>`;
    }).join("");
  }

  function renderGrid(resetPage) {
    if (resetPage) visibleCount = PAGE_SIZE;
    const list = filtered();
    const shown = list.slice(0, visibleCount);
    $("shownMeta").textContent = list.length
      ? `显示 ${shown.length} / ${list.length} 条`
      : `显示 0 条`;
    const loadBtn = $("loadMore");
    if (loadBtn) {
      loadBtn.hidden = shown.length >= list.length || !list.length;
      loadBtn.textContent = `加载更多（还有 ${Math.max(list.length - shown.length, 0)} 条）`;
    }
    if (!list.length) {
      grid.innerHTML = "";
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    grid.innerHTML = shown.map(p => {
      const on = favs.has(p.id) ? "on" : "";
      const tags = (p.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      const preview = escapeHtml(p.prompt).slice(0, 160) + (p.prompt.length > 160 ? "…" : "");
      return `<article class="card" data-id="${p.id}">
        <div class="card-top">
          <div>
            <span class="cat-badge">${escapeHtml(p.category)}</span>
            <h3 class="card-title" style="margin-top:8px">${escapeHtml(p.title)}</h3>
          </div>
          <button type="button" class="fav-btn ${on}" data-fav="${p.id}" title="收藏" aria-label="收藏">★</button>
        </div>
        <div class="tags">${tags}</div>
        <div class="prompt-preview">${preview}</div>
        <div class="tip-line">💡 ${escapeHtml(p.tip || "")}</div>
        <div class="card-actions">
          <button type="button" class="btn btn-primary" data-open="${p.id}">查看 / 填写</button>
          <button type="button" class="btn btn-ghost" data-quick="${p.id}">快速复制</button>
        </div>
      </article>`;
    }).join("");
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function openModal(p) {
    current = p;
    $("modalCat").textContent = p.category;
    $("modalTitle").textContent = p.title;
    $("modalPrompt").textContent = p.prompt;
    $("modalTip").textContent = p.tip ? ("💡 " + p.tip) : "";
    $("modalFav").textContent = favs.has(p.id) ? "取消收藏" : "收藏";

    const phs = extractPlaceholders(p.prompt);
    const form = $("phForm");
    if (phs.length) {
      form.hidden = false;
      form.innerHTML = `<div style="font-size:.85rem;font-weight:600;margin-bottom:2px">填写占位符（可选，再复制）</div>` +
        phs.map((ph, i) => {
          const id = "ph_" + i;
          const label = ph.replace(/^【|】$/g, "");
          const multi = label.length > 12 || /列表|内容|原文|代码|描述|素材/.test(label);
          const field = multi
            ? `<textarea id="${id}" data-ph="${escapeHtml(ph)}" placeholder="填写：${escapeHtml(label)}"></textarea>`
            : `<input id="${id}" data-ph="${escapeHtml(ph)}" placeholder="填写：${escapeHtml(label)}" />`;
          return `<div><label for="${id}">${escapeHtml(ph)}</label>${field}</div>`;
        }).join("");
    } else {
      form.hidden = true;
      form.innerHTML = "";
    }
    modal.classList.add("open");
  }

  function closeModal() {
    modal.classList.remove("open");
    current = null;
  }

  function getFilledPrompt() {
    if (!current) return "";
    const values = {};
    $("phForm").querySelectorAll("[data-ph]").forEach(el => {
      values[el.getAttribute("data-ph")] = el.value;
    });
    return applyPlaceholders(current.prompt, values);
  }

  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id);
    else favs.add(id);
    saveFavs();
    renderGrid();
    if (current && current.id === id) {
      $("modalFav").textContent = favs.has(id) ? "取消收藏" : "收藏";
    }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(STORAGE_THEME, theme);
    $("themeBtn").textContent = theme === "dark" ? "☀ 浅色" : "☾ 深色";
  }

  // Events
  chipBar.addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    activeCat = btn.getAttribute("data-cat");
    renderChips();
    renderGrid(true);
  });

  searchInput.addEventListener("input", () => {
    query = searchInput.value;
    renderGrid(true);
  });

  $("favOnlyBtn").addEventListener("click", () => {
    favOnly = !favOnly;
    $("favOnlyBtn").classList.toggle("active", favOnly);
    $("favOnlyBtn").setAttribute("aria-pressed", favOnly ? "true" : "false");
    renderGrid(true);
  });

  $("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
  });

  grid.addEventListener("click", (e) => {
    const fav = e.target.closest("[data-fav]");
    if (fav) { toggleFav(fav.getAttribute("data-fav")); return; }
    const open = e.target.closest("[data-open]");
    if (open) {
      const p = data.find(d => d.id === open.getAttribute("data-open"));
      if (p) openModal(p);
      return;
    }
    const quick = e.target.closest("[data-quick]");
    if (quick) {
      const p = data.find(d => d.id === quick.getAttribute("data-quick"));
      if (p) copyText(p.prompt);
    }
  });

  $("modalClose").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
  });

  $("modalCopy").addEventListener("click", () => {
    copyText(getFilledPrompt());
  });
  $("modalFav").addEventListener("click", () => {
    if (current) toggleFav(current.id);
  });

  const loadMoreBtn = $("loadMore");
  if (loadMoreBtn) {
    loadMoreBtn.addEventListener("click", () => {
      visibleCount += PAGE_SIZE;
      renderGrid(false);
    });
  }

  // Init
  $("totalCount").textContent = String(data.length);
  $("catCount").textContent = String(categories.length);
  $("favCount").textContent = String(favs.size);
  const savedTheme = localStorage.getItem(STORAGE_THEME) ||
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(savedTheme === "dark" ? "dark" : "light");
  renderChips();
  renderGrid();
})();
  </script>
</body>
</html>
